on:
    workflow_dispatch:
    push:

permissions:
  contents: read

jobs:
  build-docker:
      runs-on: cx-public-ubuntu-x64
      steps:
          - name: Fetch Code
            uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
          - name: Set up Docker Buildx
            uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
            with:
              platforms: linux/amd64

          - name: Execute Docker Build (default release)
            run: docker build -t sched:default .

          - name: Execute Docker Build (explicit release)
            run: docker build --target release -t sched:release .

          - name: Execute Docker Build (explicit debug)
            run: docker build --target debug -t sched:debug .

          - name: Check that release is default target
            run: |
              set -e
              [[ $(docker images --no-trunc --quiet sched:release) == $(docker images --no-trunc --quiet sched:default) ]]

          - name: Check that debug target is not release
            run: |
              set -e
              [[ $(docker images --no-trunc --quiet sched:release) != $(docker images --no-trunc --quiet sched:debug) ]]
              [[ $(docker images --no-trunc --quiet sched:default) != $(docker images --no-trunc --quiet sched:debug) ]]

  validate-helm:
      runs-on: cx-public-ubuntu-x64
      steps:
          - name: Fetch Code
            uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

          - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2

          - name: Execute Helm template test
            run: helm template --debug ./helm
    
  execute-unit-tests:
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          pip config set global.index-url https://pypi.echohq.com/simple
          pip install -r ${{ github.workspace }}/requirements.txt

      - name: Execute Unit Tests
        run: python -m unittest discover -v -p *test.py -s ${{ github.workspace }}/tests
