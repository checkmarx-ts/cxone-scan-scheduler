name: Publish a Release
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'The version tag to use in the form of x.x'
        required: true
        type: string
      prerelease:
        description: 'Check if this is to publish a pre-release.'
        required: true
        type: boolean
env:
  DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/cxone/scan-scheduler
  
permissions:
  contents: read

jobs:
  make-tag-string:
    runs-on: cx-public-ubuntu-x64
    outputs:
      tag: ${{ steps.tag-string.outputs.tag }}
    steps:
      - name: Create tag string
        run: |
          [ ${{ inputs.prerelease }} = false ] && echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT || \
            echo "tag=v${{ inputs.version }}-$GITHUB_RUN_NUMBER-prerelease" >> $GITHUB_OUTPUT
        id: tag-string
      
  validate-no-tag:
    runs-on: cx-public-ubuntu-x64
    needs: [make-tag-string]
    steps:
      - name: Fetch Code
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.make-tag-string.outputs.tag }}
      - name: Fail if tag ${{ needs.make-tag-string.outputs.tag }} exists
        run: |
          [[ $(git describe --tags) ==  ${{ needs.make-tag-string.outputs.tag }} ]] && exit 1 || :

  create-tag:
    needs: [make-tag-string, validate-no-tag]
    permissions:
      contents: write
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set Tag
        run: |
          git tag '${{ needs.make-tag-string.outputs.tag }}'
          git push origin '${{ needs.make-tag-string.outputs.tag }}'

  publish-container:
    needs: [create-tag, make-tag-string]
    permissions:
      packages: write
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Set up Docker Buildx
        id: buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Login to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Code @ tag ${{ needs.make-tag-string.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.make-tag-string.outputs.tag }}

      - name: Update version
        run: |
            echo "__version__='${{ needs.make-tag-string.outputs.tag }}'" > __version__.py

      - name: Build and Push Docker Image
        run: |
          BRIEFTAG=${{ needs.make-tag-string.outputs.tag }}
          docker build -f Dockerfile -t $DOCKER_REPO:$BRIEFTAG .
          [ ${{ inputs.prerelease }} = false ] && docker tag $DOCKER_REPO:$BRIEFTAG $DOCKER_REPO:latest || :
          docker push --all-tags $DOCKER_REPO

  publish-release:
    permissions:
      contents: write
    runs-on: cx-public-ubuntu-x64
    needs: [publish-container, make-tag-string]
    steps:
      - name: Fetch Code @ tag ${{ needs.make-tag-string.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.make-tag-string.outputs.tag }}

      - name: Make release text
        run: |
          echo "# CxOne Scan Scheduler ${{ needs.make-tag-string.outputs.tag }}" > release.md
          echo Executable artifacts are published in a container that can be pulled locally and executed. >> release.md
          echo '```' >> release.md
          [ ${{ inputs.prerelease }} = false ] && echo "docker pull $DOCKER_REPO:latest" >> release.md || :
          echo "docker pull $DOCKER_REPO:${{ needs.make-tag-string.outputs.tag }}" >> release.md
          echo '```' >> release.md
          echo >> release.md
          echo "A Helm chart is also available as part of the release artifacts." >> release.md

      - name: Make Helm tgz
        run: |
          cat helm/Chart.yaml | sed -E "s/(appVersion:) \"DEV\"/\1 \"${{ needs.make-tag-string.outputs.tag }}\"/g" > helm/Chart.yaml.tmp
          rm helm/Chart.yaml
          mv helm/Chart.yaml.tmp helm/Chart.yaml
          tar -C ./helm -czf cxone-scan-scheduler_helm.tgz .

      - name: Make Claude skill zip
        run: |
          cp README.md ai/cxone-scheduler-config/references
          cp -r helm ai/cxone-scheduler-config/references
          (cd ai/cxone-scheduler-config && zip -r "$OLDPWD/cxone-scheduler-config-skill.zip" . && cd $OLDPWD)

      - name: Create GitHub Release
        id: create_release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          bodyFile: release.md
          name: ${{ needs.make-tag-string.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ needs.make-tag-string.outputs.tag }}
          artifacts: "*.tgz,*-skill.zip"

  remove-tag-on-failure:
    needs: [create-tag, publish-release, make-tag-string]
    permissions:
      contents: write
    runs-on: cx-public-ubuntu-x64
    if: (failure() || cancelled()) && needs.create-tag.result == 'success'
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Remove tag
        run: git push origin ':refs/tags/${{ needs.make-tag-string.outputs.tag }}'


